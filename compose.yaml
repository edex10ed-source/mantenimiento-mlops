services:
  api:
    build: .
    image: mantenimiento-mlops
    ports:
      - "8000:8000"

  gradio:
    image: mantenimiento-mlops
    command: ["python", "app/gradio_app.py"]
    environment:
      API_URL: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
    depends_on:
      - api
    ports:
      - "7860:7860"